apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  interval: 10m
  chart:
    spec:
      chart: pgadmin4
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: runix
        namespace: pgadmin
      interval: 10m

  values:
    env:
      email: "abdul@abdulshukor.org"
      # PGADMIN_DEFAULT_EMAIL: "abdul@abdulshukor.org"
    existingSecret: pgadmin-secret
    secretKeys:
      pgadminPasswordKey: password

    service:
      type: ClusterIP
      port: 80

    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - host: pgadmin.abdulshukor.org
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: pgadmin-tls
          hosts:
            - pgadmin.abdulshukor.org

    persistence:
      enabled: true
      size: 10Gi

    strategy:
      type: Recreate
